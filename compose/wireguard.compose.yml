# WireGuard VPN gateway (server side)
# Credentials are supplied via .env — copy .env.example to .env and fill in values.
# The server runs wg1 inside a dedicated container; peers are managed with wg-quick.

services:
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      TZ: ${TZ}
      SERVERURL: ${WG_ENDPOINT}
      SERVERPORT: "51821"
      PEERS: ${WG_PEERS}
      INTERNAL_SUBNET: "10.20.0.0"
      ALLOWEDIPS: "0.0.0.0/0"
    volumes:
      - ./config:/config
    ports:
      - "51821:51821/udp"
    restart: unless-stopped
